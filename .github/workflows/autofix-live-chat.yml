name: autofix live chat imports

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  autofix:
    if: >-
      github.event.pull_request.head.ref == 'agent/premium-live-chat' &&
      !contains(github.event.pull_request.head.sha, 'never')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/premium-live-chat
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install ruff
        run: pip install -q ruff==0.15.10
      - name: sort imports exactly like ci
        run: ruff check --select I --fix services/control-api/app/routers/chat_live.py
      - name: commit fix
        run: |
          if git diff --quiet; then
            echo "imports already sorted"
            exit 0
          fi
          git config user.name "orbeAI engineering bot"
          git config user.email "actions@users.noreply.github.com"
          git add services/control-api/app/routers/chat_live.py
          git commit -m "[ruff-autofix] sort live chat imports"
          git push origin HEAD:agent/premium-live-chat
