name: ci

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: orbeai-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  cognition:
    name: cognition
    runs-on: [self-hosted, linux, x64, orbeai-lab]
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: services/cognition
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/cognition/pyproject.toml
      - name: install
        run: python -m pip install -q -e ".[dev]"
      - name: lint
        run: ruff check app tests --output-format=concise
      - name: tests
        run: pytest -q

  control-api:
    name: control-api
    runs-on: [self-hosted, linux, x64, orbeai-lab]
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: orbeai
          POSTGRES_USER: orbeai
          POSTGRES_PASSWORD: orbeai
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U orbeai -d orbeai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://orbeai:orbeai@localhost:5433/orbeai
      COGNITION_ENABLED: "false"
    defaults:
      run:
        shell: bash
        working-directory: services/control-api
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/control-api/pyproject.toml
      - name: install
        run: python -m pip install -q -e ".[dev]"
      - name: migrate test database
        run: alembic upgrade head
      - name: lint
        run: ruff check app tests --output-format=concise
      - name: tests
        run: pytest -q

  web:
    name: web
    runs-on: [self-hosted, linux, x64, orbeai-lab]
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package.json
      - name: install
        run: npm install --silent
      - name: lint
        run: npm run lint
      - name: typecheck
        run: npm run typecheck
      - name: build
        run: npm run build
