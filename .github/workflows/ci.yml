name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  cognition:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/cognition
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: install
        run: pip install -e ".[dev]"

      - name: lint
        run: ruff check app tests

      - name: tests
        run: pytest -q
