name: ci

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:

permissions:
  contents: write

jobs:
  control-api-test-report:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/transplant-orbeai-product' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/control-api
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/transplant-orbeai-product
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: pip install -q -e ".[dev]"
      - name: write test report
        run: |
          pytest -q --tb=line > /tmp/orbeai-pytest.txt 2>&1 || true
          tail -n 220 /tmp/orbeai-pytest.txt > ../../docs/control-api-test-report.txt
      - name: publish test report
        working-directory: .
        run: |
          git config user.name "orbeOne build bot"
          git config user.email "buildbot@orbeone.com.br"
          git add docs/control-api-test-report.txt
          git commit -m "add control API test diagnostic"
          git push origin HEAD:agent/transplant-orbeai-product

  cognition:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/cognition
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: pip install -q -e ".[dev]"
      - name: lint
        run: ruff check app tests --output-format=concise
      - name: tests
        run: pytest -q

  control-api:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/control-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: pip install -q -e ".[dev]"
      - name: lint
        run: ruff check app tests --output-format=concise
      - name: tests
        run: pytest -q

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: install
        run: npm install --silent
      - name: typecheck
        run: npm run typecheck
      - name: build
        run: npm run build
