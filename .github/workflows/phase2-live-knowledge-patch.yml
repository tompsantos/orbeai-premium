name: phase2-live-knowledge-patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, linux, x64, orbeai-lab]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase2-live-knowledge-trace
          fetch-depth: 0
      - name: apply focused patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: esperado 1 trecho, encontrado {count}")
              file.write_text(text.replace(old, new, 1))

          chat_live = "services/control-api/app/routers/chat_live.py"

          replace_once(
              chat_live,
              "from app.services.feature_flags import is_feature_enabled\nfrom app.services.live_run_registry import (",
              "from app.services.feature_flags import is_feature_enabled\nfrom app.services.knowledge_context import KnowledgeContextSource, resolve_knowledge_context\nfrom app.services.live_run_registry import (",
          )

          replace_once(
              chat_live,
              "    memory_context: str | None\n    memory_context_count: int\n    conversation_history: list[dict[str, Any]]",
              "    memory_context: str | None\n    memory_context_count: int\n    knowledge_context: str | None\n    knowledge_sources: list[KnowledgeContextSource]\n    knowledge_context_enabled: bool\n    conversation_history: list[dict[str, Any]]",
          )

          replace_once(
              chat_live,
              "    real_providers_enabled = is_feature_enabled(\n        db=db,\n        workspace_id=chat.workspace_id,\n        key=\"real_providers\",\n        default=True,\n    )\n    workspace_policy = get_workspace_policy(db, chat.workspace_id)",
              "    real_providers_enabled = is_feature_enabled(\n        db=db,\n        workspace_id=chat.workspace_id,\n        key=\"real_providers\",\n        default=True,\n    )\n    knowledge_context_enabled = is_feature_enabled(\n        db=db,\n        workspace_id=chat.workspace_id,\n        key=\"knowledge_context\",\n        default=True,\n    )\n    knowledge_context: str | None = None\n    knowledge_sources: list[KnowledgeContextSource] = []\n    if knowledge_context_enabled:\n        knowledge_context, knowledge_sources = resolve_knowledge_context(\n            workspace_id=chat.workspace_id,\n            chat_id=chat.id,\n            query=payload.content,\n            request_id=request_id,\n        )\n\n    workspace_policy = get_workspace_policy(db, chat.workspace_id)",
          )

          replace_once(
              chat_live,
              "        memory_context=build_memory_context(relevant_memories),\n        memory_context_count=len(relevant_memories),\n        conversation_history=conversation_history,",
              "        memory_context=build_memory_context(relevant_memories),\n        memory_context_count=len(relevant_memories),\n        knowledge_context=knowledge_context,\n        knowledge_sources=knowledge_sources,\n        knowledge_context_enabled=knowledge_context_enabled,\n        conversation_history=conversation_history,",
          )

          replace_once(
              chat_live,
              "        if chat is None or user_message is None:\n            raise RuntimeError(\"turno vivo perdeu o contexto persistido\")\n\n        assistant_message = Message(",
              "        if chat is None or user_message is None:\n            raise RuntimeError(\"turno vivo perdeu o contexto persistido\")\n\n        knowledge_source_payloads = [\n            source.public_payload() for source in turn.knowledge_sources\n        ]\n\n        assistant_message = Message(",
          )

          replace_once(
              chat_live,
              "                \"memory_context_count\": turn.memory_context_count,\n                \"memory_event_count\": len(turn.memory_events),\n                \"feature_auto_memory_enabled\": turn.auto_memory_enabled,",
              "                \"memory_context_count\": turn.memory_context_count,\n                \"memory_event_count\": len(turn.memory_events),\n                \"knowledge_context_count\": len(turn.knowledge_sources),\n                \"knowledge_sources\": knowledge_source_payloads,\n                \"feature_auto_memory_enabled\": turn.auto_memory_enabled,",
          )

          replace_once(
              chat_live,
              "                \"feature_memory_context_enabled\": turn.memory_context_enabled,\n                \"feature_real_providers_enabled\": turn.real_providers_enabled,",
              "                \"feature_memory_context_enabled\": turn.memory_context_enabled,\n                \"feature_knowledge_context_enabled\": turn.knowledge_context_enabled,\n                \"feature_real_providers_enabled\": turn.real_providers_enabled,",
          )

          replace_once(
              chat_live,
              "                \"memory_context_count\": turn.memory_context_count,\n                \"memory_event_count\": len(turn.memory_events),\n                \"provider_error\": provider_error,",
              "                \"memory_context_count\": turn.memory_context_count,\n                \"memory_event_count\": len(turn.memory_events),\n                \"knowledge_context_count\": len(turn.knowledge_sources),\n                \"knowledge_sources\": knowledge_source_payloads,\n                \"provider_error\": provider_error,",
          )

          replace_once(
              chat_live,
              "                model_preference=turn.model_preference,\n                memory_context=turn.memory_context,\n            ),",
              "                model_preference=turn.model_preference,\n                memory_context=turn.memory_context,\n                knowledge_context=turn.knowledge_context,\n            ),",
          )

          replace_once(
              chat_live,
              "                model_preference=turn.model_preference,\n                memory_context=turn.memory_context,\n            ),\n            error,",
              "                model_preference=turn.model_preference,\n                memory_context=turn.memory_context,\n                knowledge_context=turn.knowledge_context,\n            ),\n            error,",
          )

          replace_once(
              chat_live,
              "        input_tokens=estimate_tokens(turn.content + (turn.memory_context or \"\")),",
              "        input_tokens=estimate_tokens(\n            turn.content + (turn.memory_context or \"\") + (turn.knowledge_context or \"\")\n        ),",
          )

          replace_once(
              chat_live,
              "    yield _sse(\n        \"run.started\",\n        request_id=turn.request_id,\n        chat_id=turn.chat_id,\n        user_message=turn.user_message,\n        runtime=\"orbe-cognition\" if settings.cognition_enabled else \"legacy-provider\",\n    )\n\n    try:",
              "    yield _sse(\n        \"run.started\",\n        request_id=turn.request_id,\n        chat_id=turn.chat_id,\n        user_message=turn.user_message,\n        runtime=\"orbe-cognition\" if settings.cognition_enabled else \"legacy-provider\",\n    )\n\n    if turn.knowledge_sources:\n        yield _sse(\n            \"knowledge.context\",\n            request_id=turn.request_id,\n            chat_id=turn.chat_id,\n            source_count=len(turn.knowledge_sources),\n            sources=[source.public_payload() for source in turn.knowledge_sources],\n        )\n\n    try:",
          )

          replace_once(
              chat_live,
              "                    memory_context=turn.memory_context,\n                    conversation_history=turn.conversation_history,\n                ):",
              "                    memory_context=turn.memory_context,\n                    conversation_history=turn.conversation_history,\n                    knowledge_context=turn.knowledge_context,\n                    knowledge_context_resolved=True,\n                ):",
          )

          cognition = "services/control-api/app/services/cognition_client.py"
          replace_once(
              cognition,
              "    conversation_history: list[dict[str, Any]],\n    knowledge_context: str | None = None,\n) -> Iterator[dict[str, Any]]:",
              "    conversation_history: list[dict[str, Any]],\n    knowledge_context: str | None = None,\n    knowledge_context_resolved: bool = False,\n) -> Iterator[dict[str, Any]]:",
          )
          replace_once(
              cognition,
              "    if knowledge_context is None:\n        knowledge_context, sources = resolve_knowledge_context(",
              "    if knowledge_context is None and not knowledge_context_resolved:\n        knowledge_context, sources = resolve_knowledge_context(",
          )

          docs = Path("docs/live-chat-protocol.md")
          docs_text = docs.read_text()
          docs_text = docs_text.replace(
              "7. Toda seleção de conhecimento gera auditoria com ids, tipo, score e indicação de referência sem conteúdo armazenado.\n8. Resposta, model run e auditoria são persistidos no estado terminal do turno.\n9. `always` não é uma opção pública. Mudanças permanentes de política exigem governança própria.",
              "7. Toda seleção de conhecimento gera uma única auditoria com ids, tipo, score e indicação de referência sem conteúdo armazenado.\n8. O mesmo contexto selecionado é entregue ao cognition e ao provider de contingência, sem nova seleção durante o stream.\n9. Metadados públicos das fontes usadas são persistidos na mensagem do assistente e na auditoria `chat.live`.\n10. Resposta, model run e auditoria são persistidos no estado terminal do turno.\n11. `always` não é uma opção pública. Mudanças permanentes de política exigem governança própria.",
          )
          docs.write_text(docs_text)

          test = Path("services/control-api/tests/test_live_knowledge_trace.py")
          test.write_text('''import json\nfrom types import SimpleNamespace\n\nfrom fastapi.testclient import TestClient\n\nimport app.routers.chat_live as chat_live_module\nfrom app.main import app\nfrom app.services.providers.real import ProviderExecutionResult\n\nclient = TestClient(app)\n\n\ndef _events(body: str) -> list[dict]:\n    events: list[dict] = []\n    for block in body.split("\\n\\n"):\n        data_line = next(\n            (line for line in block.splitlines() if line.startswith("data: ")),\n            None,\n        )\n        if data_line:\n            events.append(json.loads(data_line[6:]))\n    return events\n\n\ndef test_live_fallback_uses_and_persists_selected_knowledge(monkeypatch) -> None:\n    report_response = client.post(\n        "/v1/knowledge/reports",\n        json={\n            "question": "Como funciona o protocolo pitanga orbital?",\n            "status": "concluído",\n            "summary": (\n                "O protocolo pitanga orbital preserva a origem, limita o contexto "\n                "e registra as fontes usadas no turno vivo."\n            ),\n        },\n    )\n    assert report_response.status_code == 201\n    report = report_response.json()\n\n    material_response = client.post(\n        "/v1/knowledge/materials",\n        json={\n            "report_id": report["id"],\n            "title": "Referência pitanga orbital",\n            "kind": "arquivo",\n            "excerpt": "Referência cadastrada para o protocolo pitanga orbital.",\n            "confidence": 0.9,\n            "meta": {"content_stored": False},\n        },\n    )\n    assert material_response.status_code == 201\n    material = material_response.json()\n\n    captured: dict[str, str | None] = {}\n\n    def fake_execute_provider(\n        *,\n        provider_slug: str,\n        content: str,\n        mode: str,\n        model_preference: str,\n        memory_context: str | None = None,\n        knowledge_context: str | None = None,\n    ) -> ProviderExecutionResult:\n        captured["provider_slug"] = provider_slug\n        captured["knowledge_context"] = knowledge_context\n        return ProviderExecutionResult(\n            content="fallback validado com conhecimento persistido",\n            provider_name="orbe-test",\n            model_name="orbe-test-model",\n            input_tokens=12,\n            output_tokens=7,\n            latency_ms=1,\n            estimated_cost_usd=0.0,\n        )\n\n    monkeypatch.setattr(\n        chat_live_module,\n        "get_settings",\n        lambda: SimpleNamespace(\n            cognition_enabled=False,\n            cognition_fallback_to_legacy=True,\n        ),\n    )\n    monkeypatch.setattr(chat_live_module, "execute_provider", fake_execute_provider)\n\n    with client.stream(\n        "POST",\n        "/v1/chat/live",\n        json={\n            "content": "Explique o protocolo pitanga orbital.",\n            "mode": "research",\n            "model_preference": "auto",\n        },\n    ) as response:\n        body = "".join(response.iter_text())\n\n    assert response.status_code == 201\n    events = _events(body)\n    knowledge_events = [event for event in events if event["type"] == "knowledge.context"]\n    assert len(knowledge_events) == 1\n\n    source_ids = {source["source_id"] for source in knowledge_events[0]["sources"]}\n    assert source_ids == {report["id"], material["id"]}\n    material_source = next(\n        source\n        for source in knowledge_events[0]["sources"]\n        if source["source_id"] == material["id"]\n    )\n    assert material_source["metadata_only"] is True\n\n    selected_context = captured["knowledge_context"]\n    assert selected_context is not None\n    assert report["id"] in selected_context\n    assert material["id"] in selected_context\n\n    completed = events[-1]["response"]\n    assistant_meta = completed["assistant_message"]["meta"]\n    assert assistant_meta["knowledge_context_count"] == 2\n    assert {source["source_id"] for source in assistant_meta["knowledge_sources"]} == source_ids\n    assert assistant_meta["feature_knowledge_context_enabled"] is True\n\n    selection_logs = client.get(\n        "/v1/audit-logs?action=knowledge.context.select&limit=300"\n    ).json()\n    matching_selections = [\n        log for log in selection_logs if log["resource_id"] == completed["chat_id"]\n    ]\n    assert len(matching_selections) == 1\n\n    live_logs = client.get("/v1/audit-logs?action=chat.live&limit=300").json()\n    live_trace = next(\n        log for log in live_logs if log["resource_id"] == completed["chat_id"]\n    )\n    assert live_trace["meta"]["knowledge_context_count"] == 2\n    assert {\n        source["source_id"] for source in live_trace["meta"]["knowledge_sources"]\n    } == source_ids\n''')
          PY
      - name: commit patch
        shell: bash
        run: |
          git config user.name "orbeone-lab-01"
          git config user.email "actions@orbeone.ia.br"
          git add services/control-api/app/routers/chat_live.py \
            services/control-api/app/services/cognition_client.py \
            services/control-api/tests/test_live_knowledge_trace.py \
            docs/live-chat-protocol.md
          git commit -m "feat: persiste conhecimento usado no chat ao vivo"
          git push origin HEAD:agent/phase2-live-knowledge-trace
