name: mock auth hotfix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: patch mock authentication
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("apps/web/src/lib/auth/authService.ts")
          content = path.read_text(encoding="utf-8")
          content = content.replace(
              'const API_BASE_URL = env.VITE_API_BASE_URL ?? "";\n',
              'const API_BASE_URL = env.VITE_API_BASE_URL ?? "";\nconst MOCK_MODE = (env.VITE_MOCK_MODE ?? "true") !== "false";\n',
          )
          marker = 'export interface RegisterPayload {\n  email: string;\n  name: string;\n  password: string;\n}\n\n'
          insert = '''export interface RegisterPayload {\n  email: string;\n  name: string;\n  password: string;\n}\n\nfunction createMockSession(email: string, name = "Tom"): AuthTokenResponse {\n  const now = new Date();\n  const data: AuthTokenResponse = {\n    access_token: `mock_${crypto.randomUUID()}`,\n    token_type: "bearer",\n    expires_at: new Date(now.getTime() + 24 * 60 * 60 * 1000).toISOString(),\n    user: {\n      id: "usr_mock_tom",\n      email,\n      name,\n      status: "active",\n      is_superuser: true,\n      last_login_at: now.toISOString(),\n      created_at: now.toISOString(),\n      updated_at: now.toISOString(),\n    },\n  };\n\n  setAuthSession(data);\n  return data;\n}\n\n'''
          if marker not in content:
              raise SystemExit("register payload marker not found")
          content = content.replace(marker, insert, 1)
          content = content.replace(
              'export async function login(payload: LoginPayload): Promise<AuthTokenResponse> {\n  const response = await fetch(buildUrl("/v1/auth/login"), {',
              'export async function login(payload: LoginPayload): Promise<AuthTokenResponse> {\n  if (MOCK_MODE) {\n    return createMockSession(payload.email);\n  }\n\n  const response = await fetch(buildUrl("/v1/auth/login"), {',
          )
          content = content.replace(
              'export async function register(payload: RegisterPayload): Promise<AuthTokenResponse> {\n  const response = await fetch(buildUrl("/v1/auth/register"), {',
              'export async function register(payload: RegisterPayload): Promise<AuthTokenResponse> {\n  if (MOCK_MODE) {\n    return createMockSession(payload.email, payload.name);\n  }\n\n  const response = await fetch(buildUrl("/v1/auth/register"), {',
          )
          content = content.replace(
              'export async function logout(): Promise<void> {\n  const token = getAuthToken();',
              'export async function logout(): Promise<void> {\n  if (MOCK_MODE) {\n    clearAuthSession();\n    return;\n  }\n\n  const token = getAuthToken();',
          )
          path.write_text(content, encoding="utf-8")
          PY
          npm --prefix apps/web install --silent
          npm --prefix apps/web run typecheck
          npm --prefix apps/web run build
      - name: commit hotfix
        shell: bash
        run: |
          git config user.name "orbeAI engineering bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/src/lib/auth/authService.ts
          git commit -m "fix: support local auth in mock preview"
          git push origin HEAD:main
