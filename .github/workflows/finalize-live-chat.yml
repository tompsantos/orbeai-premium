name: finalize live chat branch

on:
  push:
    branches:
      - agent/premium-live-chat

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[live-chat-finalize]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/premium-live-chat

      - name: finalize readable product files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              content = target.read_text(encoding="utf-8")
              if old not in content:
                  raise SystemExit(f"expected block not found in {path}: {old[:80]!r}")
              target.write_text(content.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "apps/web/src/types/index.ts",
              'export type ProviderSlug = "openai" | "anthropic" | "gemini" | "qwen" | "groq" | "local" | "mock";',
              'export type ProviderSlug =\n  | "orbe-cognition"\n  | "openai"\n  | "anthropic"\n  | "gemini"\n  | "qwen"\n  | "groq"\n  | "local"\n  | "mock";',
          )

          replace_once(
              "apps/web/src/lib/api/services/liveChatService.ts",
              '  if (normalized.includes("cognition") || normalized.includes("local")) return "local";',
              '  if (normalized.includes("cognition") || normalized.includes("hermes")) return "orbe-cognition";\n  if (normalized.includes("local")) return "local";',
          )

          replace_once(
              "apps/web/src/routes/app.chat.tsx",
              '<Button size="sm" onClick={newChat} className="h-8">',
              '<Button size="sm" onClick={newChat} disabled={streaming} className="h-8">',
          )
          replace_once(
              "apps/web/src/routes/app.chat.tsx",
              '                      onClick={() => setActiveChatId(chat.id)}\n                      title={chat.title}',
              '                      disabled={streaming && !active}\n                      onClick={() => setActiveChatId(chat.id)}\n                      title={chat.title}',
          )
          replace_once(
              "apps/web/src/routes/app.chat.tsx",
              '                      className={cn(\n                        "w-full min-w-0 overflow-hidden rounded-lg border px-2.5 py-2 pr-11 text-left transition-colors",',
              '                      className={cn(\n                        "w-full min-w-0 overflow-hidden rounded-lg border px-2.5 py-2 pr-11 text-left transition-colors disabled:cursor-not-allowed disabled:opacity-50",',
          )
          replace_once(
              "apps/web/src/routes/app.chat.tsx",
              '                      type="button"\n                      onClick={(event) => {',
              '                      type="button"\n                      disabled={streaming}\n                      onClick={(event) => {',
          )
          replace_once(
              "apps/web/src/routes/app.chat.tsx",
              '                      className="absolute right-1 top-1 h-8 w-8 rounded-lg border border-border/60 bg-card/80 text-muted-foreground transition-colors hover:bg-destructive/10 hover:text-destructive"',
              '                      className="absolute right-1 top-1 h-8 w-8 rounded-lg border border-border/60 bg-card/80 text-muted-foreground transition-colors hover:bg-destructive/10 hover:text-destructive disabled:cursor-not-allowed disabled:opacity-40"',
          )

          Path("docs/live-chat-protocol.md").write_text(
              """# protocolo do chat premium vivo

O chat ao vivo usa `POST` com resposta `text/event-stream` em todas as camadas:

```text
browser -> control-api -> orbe-cognition -> Hermes AIAgent
```

## endpoints

### control API

- `POST /v1/chat/live`
- `POST /v1/chat/live/{request_id}/stop`
- `POST /v1/chat/live/{request_id}/approval`

### cognition

- `POST /v1/turns/stream`
- `POST /v1/turns/{request_id}/stop`
- `POST /v1/turns/{request_id}/approval`

## eventos principais

- `run.started`: execução registrada e iniciada.
- `run.status`: estado visual seguro, sem raciocínio interno.
- `response.commentary`: comentário intermediário completo.
- `tool.started` e `tool.completed`: atividade de ferramenta sanitizada.
- `approval.required`: o turno aguarda decisão do usuário.
- `response.delta`: texto incremental real emitido pelo Hermes/provider.
- `fallback.started`: contingência ativada antes do primeiro delta.
- `response.completed`, `response.stopped` ou `response.failed`: terminal persistido.

## invariantes

1. O frontend nunca acessa o cognition diretamente.
2. Toda parada ou aprovação é validada por workspace e usuário no control API.
3. Fallback só ocorre antes do primeiro texto cognitivo.
4. Raciocínio interno não é transmitido. Apenas estados de apresentação.
5. O usuário e a memória automática são persistidos antes do stream; resposta, model run e auditoria são persistidos no terminal do turno.
6. `always` não é uma opção pública. Mudanças permanentes de política exigem governança própria.
""",
              encoding="utf-8",
          )
          PY

          rm -rf .live-chat-bundle
          git diff --check

      - name: commit finalized live chat
        shell: bash
        run: |
          if git diff --quiet; then
            echo "nothing to finalize"
            exit 0
          fi
          git config user.name "orbeAI engineering bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web docs .live-chat-bundle
          git commit -m "[live-chat-finalize] polish premium live chat"
          git push origin HEAD:agent/premium-live-chat
